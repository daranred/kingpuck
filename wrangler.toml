name = "kingpuck"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

[vars]
SITE_URL = "https://kingpuck.com"
CURRENCY = "eur"

# Paid orders are written here by the Stripe webhook.
# Create with: npx wrangler kv namespace create ORDERS  — then paste the id below.
# [[kv_namespaces]]
# binding = "ORDERS"
# id = "REPLACE_ME"

# Archive submissions (photos + stories) land here for review.
# Create with: npx wrangler r2 bucket create kingpuck-archive
# then uncomment:
# [[r2_buckets]]
# binding = "ARCHIVE"
# bucket_name = "kingpuck-archive"
