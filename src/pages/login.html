<!-- {"title": "Sign in — King Puck", "desc": "Sign in to King Puck with a one-time email link."} -->
<section class="block">
  <div class="wrap narrow stack stack-lg">
    <h1 class="mb-0">Sign in</h1>
    <p class="lead mb-0">No password needed. Enter your email and we'll send you a one-time link to sign in.</p>
    <form class="form" data-login-form>
      <label>Email<input name="email" type="email" required autocomplete="email" inputmode="email"></label>
      <button class="btn red" type="submit">Email me a sign-in link →</button>
      <p class="form-status" role="status" data-form-status></p>
    </form>
    <p class="muted mb-0" style="font-size:var(--text-sm)">With an account you can see your orders and the photographs and stories you've shared with the archive.</p>
  </div>
</section>
